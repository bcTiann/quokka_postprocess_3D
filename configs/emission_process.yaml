# Process the complete QUOKKA snapshot. Paths are relative to this file.
# The two lookup tables are included in Git. Supply your existing snapshot
# at the dataset path below, or replace dataset with its absolute path.
dataset: ../inputs/snapshots/plt0655228
despotic_table: ../inputs/tables/despotic/interpolated.npz
cloudy_table: ../inputs/tables/cloudy/emission.npz
query_chunk: 1000000
chunk_workers: 2
spectral_workers: 3  # Per chunk: at most 2 x 3 spectral threads.
output_dir: ../output/plt0655228/processed
# Optional native x-y region; stops are excluded and z stays complete.
# x_index_range: [64, 128]
# y_index_range: [32, 96]
# Choose a new output_dir when processing a region.
