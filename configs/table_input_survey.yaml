# Batch input-range survey. Relative paths start at this YAML file.
# source_root protects the entire simulation tree from output writes.
source_root: ../inputs/snapshots

# Output job name: run directory relative to source_root.
# Each run is searched for direct plt+digits directories only.
jobs:
  reference: .

output_dir: ../output/table_input_ranges

# Read one snapshot at a time by default. Native XY block columns retain
# complete z-column physics through two passes over contiguous block fields.
snapshot_workers: 1
query_chunk: 1000000

# Optional limits for one invocation. Completed scans are reused without
# counting toward max_new_snapshots. The time limit stops new scans from
# starting; scans already running finish and save their results.
# max_new_snapshots: 2
# max_runtime_minutes: 120

# Diagnostic only; omit this to scan every native XY block column.
# max_columns: 1

# Bundled table paths are defaults. Optional overrides start at this YAML file.
# despotic_table: ../inputs/tables/despotic/interpolated.npz
# cloudy_table: ../inputs/tables/cloudy/emission.npz
