# Shared selection. Relative YAML paths start at this file.
jobname: reference_job
dataset: ../inputs/snapshots/plt0655228
results_dir: ../output
# Results: ../output/sigma13.v2/plt0655228/{processed,figures,figures_titled}/

# jobname only names the output group; choose it manually for each simulation run.
# Every CLI --dataset requires explicit --jobname, even if YAML has that group.
# A missing pair is rejected before config/input access or output creation.
# CLI dataset paths must be absolute; omitted dataset keeps the YAML path.
# uv run process --dataset /absolute/path/plt0008703 --jobname my-run --x 64 128 --y 32 64
# uv run plot --dataset /absolute/path/plt0008703 --jobname my-run --x 64 128 --y 32 64
# Process also accepts /absolute/path/run1/ and plots each snapshot by default.
# Use process --no-plot for numerical products only, then draw the chosen group:
# uv run plot --all --jobname my-run
# Repeat CLI jobname and x/y overrides later; they do not persist or edit YAML.
# --jobname alone changes only the group; omitted jobname keeps the YAML group.
# Bare plot --all uses the YAML group; automatic plots use process's chosen group.
# Omitted x/y options keep their corresponding YAML range.

# Optional native x-y region; null selects the full axis. z stays complete.
# For example, x_index_range: [64, 128] selects x indices 64 through 127.
x_index_range: null
y_index_range: null
# Explicit ranges automatically add a region subdirectory, for example
# ../output/sigma13.v2/plt0655228/region_x64-128_yall/.
# Process and plot select the same region directory from these settings.

# Processing: cells per query batch, concurrent batches, threads per batch.
query_chunk: 131072
chunk_workers: 16
spectral_workers: 1
slab_nx: 8
# Retained for native-reader utilities; the process eager reader uses slab_nx.
field_cache_slabs: 16
field_cache_gib: 12
spectral_method: histogram-2d
# Optional absolute path of an existing validated raw z-field cache.
# Null keeps a scoped temporary conversion; a supplied cache is read-only.
prepared_z_fields: null
# Independent tasks within the single-snapshot reader and main accumulator.
z_reader_threads: 32
z_read_workers: 5
# Null selects 4 when OpenMP is available, otherwise 1.
histogram_merge_threads: null
# Only a temporary copy created by this process is removed on completion/failure.

# Plotting: PNG with titles by default; CLI flags override each selection.
figure_formats: [png]
figure_styles: [titled]
image_downsample_factor: 1
# To select factor 2, first prepare it without rereading the simulation:
# uv run python -m quokka2s.prepare_emission_results --image-downsample-factor 2

# Explicit bundled inputs, relative to this YAML file.
# DESPOTIC is the validated expanded 55 x 60 x 64 interpolated table.
# The previous table is kept as interpolated_old.npz for reproducibility.
despotic_table: ../inputs/tables/despotic/interpolated.npz
# Cloudy includes two extra low-density planes; NH and temperature are unchanged.
# The original table and every original node are preserved in emission_old.npz.
cloudy_table: ../inputs/tables/cloudy/emission.npz
dust_opacity_table: ../vendor/draine/kext_albedo_WD_MW_3.1_60_D03.all
