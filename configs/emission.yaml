# One snapshot only. Supply its absolute path here or with --dataset.
# A containing run directory is rejected; sibling plt directories are never run.
dataset: null
jobname: reference_job
results_dir: ../output
# Other relative paths are anchored to this YAML file.
# Results: ../output/reference_job/pltNNNNNNN/{processed,figures,figures_titled}/
# --jobname optionally selects a different output group for this invocation.
# uv run python process_snapshot.py --dataset /absolute/path/plt0008703
# uv run python plot_emission_results.py --dataset /absolute/path/plt0008703
# Process saves numbers only. Plot independently reads those saved products.

# Native cell indices [start, stop); null selects the entire axis.
# All selected columns retain their full z depth, regardless of grid dimensions.
# uv run python process_snapshot.py --dataset /absolute/path/plt0008703 --x 64 66 --y 64 66
# Use the same --x/--y selection with plot to select the matching saved region.
x_index_range: null
y_index_range: null

# Bounded original-plt reads and NumPy calculation; no z-contiguous disk copy.
# query_chunk is a maximum batch size; final batches may contain fewer cells.
query_chunk: 262144
chunk_workers: 32
z_reader_threads: 32
z_read_workers: 5

# Precompute stored Gaussian bin integrals, accumulate four corner luminosities,
# then convolve completed luminosity arrays into 400 channels over [-200,200].
# Sigma nodes are logarithmically spaced; weights use linear phase and sigma.
# null uses sigma=[1e-5,1024] km/s, ln(sigma) spacing=1/32, maximum phase step=0.1.
# Valid widths outside the table use direct +/-5sigma integration and are logged.
# Optional keys: sigma_min, sigma_max, log_sigma_step, mu_spacing_ratio,
# maximum_phase_step. These settings do not change the observation bins.
gaussian_grid: null

# Plot settings apply only to plot_emission_results.py.
figure_formats: [png]
figure_styles: [titled]
image_downsample_factor: 1
# To select factor 2, first prepare it from existing products:
# uv run python -m quokka2s.prepare_emission_results --products /absolute/path/to/processed --image-downsample-factor 2

# Bundled physical tables and dust opacity, relative to this YAML file.
despotic_table: ../inputs/tables/despotic/interpolated.npz
cloudy_table: ../inputs/tables/cloudy/emission.npz
dust_opacity_table: ../vendor/draine/kext_albedo_WD_MW_3.1_60_D03.all
