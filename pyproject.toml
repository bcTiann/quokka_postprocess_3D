[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quokka2s"
version = "0.1.0"
requires-python = ">=3.10"

# Runtime dependencies for the analysis pipeline (reading a prebuilt DESPOTIC
# table + the simulation snapshot and producing the plots).
#
# yt is intentionally not listed here: plotting saved products does not need it.
# For snapshot processing, requirements.txt pins the tested yt source commit
# together with the numerical dependencies. Install that file before this package.
#
dependencies = [
    "numpy>=2,<2.3",
    "scipy>=1.10",
    "astropy>=6",
    "h5py>=3",
    "matplotlib>=3.7",
    "unyt>=3",
    "joblib>=1.5",            # streaming unordered point results in table builds
    "tqdm>=4.6",
    "tqdm-joblib>=0.0.4",
    "pyyaml>=6",              # yt's QuokkaDataset parses metadata.yaml
]

[project.scripts]
quokka2s-process = "quokka2s.process_snapshot:main"
quokka2s-plot = "quokka2s.plot_emission_results:main"

[project.optional-dependencies]
# Only needed to (re)build the DESPOTIC tables — NOT for running the pipeline,
# which reads a prebuilt despotic_table.npz.  Install with:  pip install -e ".[tables]"
# DESPOTIC reports version 2.2 on its official Bitbucket master, but 2.2 was
# never published to PyPI (whose latest release is 2.1 and predates the GOW
# chemistry network used by this project).  Pin the tested upstream source
# commit so this extra is both installable and reproducible.
tables = [
    "despotic @ git+https://bitbucket.org/krumholz/despotic.git@ed18e5669adb7306f795a3d30d8919995793bc61",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
